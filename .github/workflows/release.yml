# 发版流水线：push v* tag 触发 → 云端构建 APK → 创建 GitHub Release
# （Obtainium 靠 Release 检测更新；本地发版从此不需要 Android SDK）
# 用法：bump app/build.gradle.kts 版本号后 ./release.sh vX.Y.Z（或手动 commit+tag+push）
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # gh release create / 上传 asset

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # gradle.properties 写死了原开发机路径 org.gradle.java.home=/usr/lib/jvm/jdk-17，
      # CI 上指向 setup-java 的 JAVA_HOME（改法与本地验证 :sync:test 时一致，不动仓库内容）
      - name: Point org.gradle.java.home at CI JDK
        run: sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" gradle.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK="dailynotes-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "dailynotes $TAG" \
            --notes "自托管日记+速记。更新内容见 docs/development-plan.md。服务端: server/docker-compose.yml（部署说明见 README）"
